# Feste Versionen fuer reproduzierbare Builds (arduino-cli >= 1.0).
#   arduino-cli compile --profile c3 waage
#   arduino-cli upload  --profile c3 -p /dev/ttyACM0 waage
# Bei Updates hier UND in .arduino_config.lua (Editor) die Werte anpassen.
profiles:
  c3:
    fqbn: esp32:esp32:nologo_esp32c3_super_mini
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Adafruit SSD1306 (2.5.17)
      - Adafruit GFX Library (1.12.6)
      - Adafruit BusIO (1.17.4)
      - HX711 (0.6.5)

default_profile: c3
default_port: /dev/ttyACM0
