name: Build Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Configure arduino-cli
      run: |
        arduino-cli config init
        arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

    - name: Install ESP32 Core
      run: |
        arduino-cli core update-index
        for i in {1..5}; do
          if arduino-cli core install esp32:esp32; then
            break
          else
            echo "Install failed, retrying ($i/5)..."
            sleep 5
          fi
        done

    - name: Install Libraries
      run: |
        arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library" "Adafruit BusIO" "HX711"

    - name: Compile Sketch
      run: |
        mkdir build_output
        arduino-cli compile --fqbn esp32:esp32:nologo_esp32c3_super_mini --output-dir build_output waage/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 100-Waage-Firmware
        path: build_output/waage.ino.bin

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: build_output/waage.ino.bin
